# Use together with compose.yaml; dependencies remain outside source mounts.
services:
  backend:
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ../backend/src:/app/src:ro
    command: ["uvicorn", "rag.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
  frontend:
    volumes:
      - ../frontend:/app:ro
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7860", "--reload", "--reload-dir", "/app", "--reload-include", "*.css", "--reload-include", "*.js"]
