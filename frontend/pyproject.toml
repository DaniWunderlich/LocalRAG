[project]
name = "rag-frontend"
version = "0.3.0"
description = "Gradio interface for local document questions and source inspection."
requires-python = ">=3.14,<3.15"
dependencies = ["gradio==6.31.0", "httpx==0.28.1", "fastapi==0.162.3", "uvicorn[standard]==0.54.0"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.19",
    "pytest>=9",
    "playwright==1.65.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
