[project]
name = "rag-frontend"
version = "0.1.0"
description = "Streamlit interface for local document questions and source inspection."
requires-python = ">=3.14,<3.15"
dependencies = ["streamlit>=1.54", "httpx>=0.28"]

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.19", "pytest>=9"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
