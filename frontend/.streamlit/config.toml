[browser]
gatherUsageStats = false

[server]
maxUploadSize = 20

[client]
toolbarMode = "viewer"

[theme]
font = "Segoe UI, system-ui, sans-serif"
headingFont = "Georgia, serif"
headingFontSizes = ["1.85rem", "1.4rem", "1.15rem"]
headingFontWeights = [500, 500, 600]
codeFont = "Cascadia Code, Consolas, monospace"
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
showWidgetBorder = true

[theme.light]
grayTextColor = "#59645D"
primaryColor = "#245B49"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#EEEDE7"
textColor = "#232C28"
borderColor = "#D4D9D1"

[theme.light.sidebar]
backgroundColor = "#EEEDE7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#232C28"

[theme.dark]
grayTextColor = "#B2BEB4"
primaryColor = "#8FC7AF"
backgroundColor = "#171C19"
secondaryBackgroundColor = "#252D28"
textColor = "#EBEEE9"
borderColor = "#46544B"

[theme.dark.sidebar]
backgroundColor = "#202722"
secondaryBackgroundColor = "#2B352E"
textColor = "#EBEEE9"
